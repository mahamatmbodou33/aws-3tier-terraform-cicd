name: Deploy App Artifacts Prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
   AWS_REGION: us-east-1
   APP1_ECR_REPOSITORY: three-tier-app-prod-app1
   APP2_ECR_REPOSITORY: three-tier-app-prod-app2
   APP1_ASG_NAME: three-tier-app-prod-app1-asg
   APP2_ASG_NAME: three-tier-app-prod-app2-asg


jobs:
   build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app1 image
        run: |
          APP1_IMAGE=${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP1_ECR_REPOSITORY }}:latest
          docker build -t $APP1_IMAGE ./apps/app1
          docker push $APP1_IMAGE

      - name: Build and push app2 image
        run: |
          APP2_IMAGE=${{ steps.account.outputs.id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP2_ECR_REPOSITORY }}:latest
          docker build -t $APP2_IMAGE ./apps/app2
          docker push $APP2_IMAGE

  refresh-app1:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Refresh app1 ASG safely
        shell: bash
        run: |
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name three-tier-app-prod-app1-asg \
            --region us-east-1 \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "NONE")

          echo "Current app1 refresh status: $STATUS"

          if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; then
            echo "Instance refresh already running for app1. Skipping."
            exit 0
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name three-tier-app-prod-app1-asg \
            --region us-east-1 \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":300}'

  refresh-app2:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Refresh app2 ASG safely
        shell: bash
        run: |
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name three-tier-app-prod-app2-asg \
            --region us-east-1 \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "NONE")

          echo "Current app2 refresh status: $STATUS"

          if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; then
            echo "Instance refresh already running for app2. Skipping."
            exit 0
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name three-tier-app-prod-app2-asg \
            --region us-east-1 \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":300}'